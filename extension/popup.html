
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewLens</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="logo">🔍</div>
            <div>
                <h1>ReviewLens</h1>
                <p class="subtitle">AI-powered review analysis</p>
            </div>
        </div>

        <div id="status" class="status">
            Checking page...
        </div>

        <!-- Find the same product on the other marketplace -->
        <button id="findMatchBtn" class="analyze-btn">
            Find Matching Product
        </button>

        <!-- Suggested product and confirmation UI -->
        <div id="productMatchContainer"></div>

        <!-- Existing review analysis button -->
        <button id="analyzeBtn" class="analyze-btn">
            Analyze Reviews
        </button>

        <!-- Existing AI dashboard -->
        <div id="summaryContainer"></div>

        <!-- Cross-platform comparison results -->
        <div id="comparisonContainer"></div>

        <!-- Existing individual reviews -->
        <div class="reviews-section">
            <h2>Reviews</h2>
            <div id="reviewsContainer"></div>
        </div>

    </div>

    <script src="popup.js"></script>
</body>
</html>
