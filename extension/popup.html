<!DOCTYPE html>

<head>

    <title>ReviewLens</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <div class="logo">
                🔍
            </div>

            <div>
                <h1>ReviewLens</h1>

                <p class="subtitle">

            </div>

        </div>

        <div id="status" class="status">

        <!-- Analyze Button -->

            <div id="reviewsContainer"></div>

        </div>

    </div>


    <script src="popup.js"></script>
